          description: Страница с наставниками
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /mentors/recommendations:
    get:
      tags:
      - Recommendations
      summary: Умный подбор (Top-10)
      operationId: getMentorRecommendations
      description: |-
        Сравнивает анкету ученика с анкетами наставников. Веса критериев: навыки 50%, цели 20%, время 20%, стиль общения 10%. В выдачу попадают только наставники с совпадением от 60% и свободными местами, не более 10, по убыванию совпадения. Если таких нет, возвращается пустой массив. Если анкета ученика не заполнена (`onboarding_completed = false`), возвращается 409 с кодом `PROFILE_INCOMPLETE`.

        **Расчёт критериев (для бэкенда).** Навыки: доля `target_skills` ученика среди `current_skills` наставника; уровень ученика (среднее по его `current_skills`: до 1,5 — `beginner`, до 2,5 — `has_basics`, иначе `advanced`) должен входить в `target_student_levels` наставника, иначе критерий умножается на 0,5. Цели: доля `main_goals` ученика, для которых есть соответствие в `help_topics` наставника (`find_job_or_internship` → `first_job_in_it`, `interview_prep`, `portfolio`; `learn_new_skill` → `code_review`, `career_growth`; `build_project` → `portfolio`, `code_review`; `interview_prep` → `interview_prep`; `change_direction` → `change_direction`, `career_growth`; `develop_soft_skills` → `soft_skills`). Время: доля слотов ученика (`availability_slots`), совпадающих со слотами наставника, с учётом `time_limit`. Стиль: 100 при совпадении `communication_style`, 50 если у одной из сторон `free`, иначе 0.
      responses:
        '200':
          description: Топ совпадений (может быть пустым)
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/MentorSummary'
                  - type: object
                    required:
                    - match
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
