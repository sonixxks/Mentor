openapi: 3.0.3
info:
  title: Curator MVP API
  description: |-
    API спецификация платформы менторства «Куратор».

    **Матрица переходов заявок (State Machine):**

    * Ученик: `pending` -> `cancelled`; `approved_by_mentor` -> `accepted`.

    * Наставник: `pending` -> `approved_by_mentor` / `rejected_by_mentor`.

    * Куратор: любой нетерминальный статус -> `rejected_by_curator` (с причиной). Резерв: экрана в MVP нет, но право в API сохранено.


    **Коды подтверждения (OTP):** хранятся в Redis, не в PostgreSQL. Срок жизни 10 минут, максимум 3 попытки ввода, повторная отправка не чаще раза в 60 секунд. Данные незавершённой регистрации также хранятся в Redis до подтверждения почты.


    **Токены:** access-токен (JWT) живёт 15 минут. Refresh-токены хранятся в Redis (в виде хэша), не в PostgreSQL: срок жизни задаётся TTL, 30 дней при `remember_me = true` и 24 часа без него. Выход и смена или сброс пароля отзывают refresh-токены пользователя; при перезапуске Redis без сохранения данных пользователям придётся войти заново.


    **Время:** платформа работает в одном часовом поясе — Екатеринбург (`Asia/Yekaterinburg`, UTC+5), на экранах пометка «время по Екатеринбургу». Моменты времени (`date-time`) передаются в формате ISO 8601 с указанием смещения и хранятся в UTC, слоты `availability_slots` задаются в екатеринбургском времени.


    **Аккаунты:** куратора создаёт администратор через API (`POST /admin/curators`): на почту уходит приглашение со ссылкой на 48 часов, пароль задаётся по ссылке. Аккаунты администраторов заводятся вне API.


    **Приватность:** до создания пары наставник видит у ученика только имя, интересы и условия (`target_skills`, `main_goals`, `time_limit`, срок, `communication_style`), процент совместимости и сопроводительное письмо. Фамилия, фото, возраст, курс и специальность открываются (фамилия и фото) только после создания воркспейса.


    **Верификация наставников:** наставник прикладывает документы и ссылки, куратор проверяет их вручную за пределами системы и ставит итоговый статус (`verified` / `rejected`). Причина отказа в профиле не хранится: комментарий куратора уходит наставнику уведомлением. Если после верификации (или отказа) наставник добавляет новый материал, статус возвращается в `pending`, и до повторной проверки он не виден в каталоге (текущие пары продолжают работу). В каталоге видны только наставники со статусом `verified` и `is_published = true`.


    **Слоты наставника:** воркспейс в статусе `active`, `paused` или `stagnation` занимает место; `completed` освобождает. `free_slots = max_students` минус занятые места.


    **Вне scope MVP:** платежи, видеозапись встреч, чат с куратором и чат-бот (раздел FAQ статический, на фронтенде), мероприятия, подписка на календарь (.ics), совместное редактирование заметок в реальном времени, статус «в сети», шаблоны задач у программ, блокировка и удаление пользователей, аналитика и настройки админа.
  version: 1.2.0
servers:
- url: https://api.curator.ru/api/v1
  description: Основной сервер
security:
- BearerAuth: []
tags:
- name: Auth
- name: Account
- name: Profiles
- name: Catalog
- name: Recommendations
- name: Requests
- name: Workspaces
- name: Calendar
- name: Notifications
- name: Curator
- name: Admin
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Шаг 1. Регистрация (отправка кода на почту)
      operationId: registerUser
      description: Аккаунт в БД создаётся только после подтверждения почты (`/auth/verify-email`).
      security: &id001 []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Код отправлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/verify-email:
    post:
      tags:
      - Auth
      summary: Шаг 2. Подтверждение почты
      operationId: verifyEmail
      description: Создаёт аккаунт и пустой профиль, возвращает токены (пользователь сразу переходит к анкете).
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
      responses:
        '201':
          description: Аккаунт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/resend-code:
    post:
      tags:
      - Auth
      summary: Переотправить код подтверждения почты
      operationId: resendCode
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Код отправлен повторно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSentResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Вход
      operationId: loginUser
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/yandex:
    post:
      tags:
      - Auth
      summary: Вход / регистрация через Яндекс ID
      operationId: loginWithYandex
      description: 'Фронтенд получает от Яндекса `code` и передаёт его сюда. Бэкенд обменивает код на данные пользователя и ищет аккаунт по `yandex_id`,
        затем по email (почта от Яндекса считается подтверждённой). Если аккаунта нет, он создаётся: для этого обязательны `role` и `terms_accepted`,
        иначе возвращается 409 с кодом `ROLE_REQUIRED`. У такого аккаунта нет пароля (его можно задать через сброс пароля).'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              - redirect_uri
              properties:
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                role:
                  type: string
                  enum:
                  - student
                  - mentor
                  description: Обязателен при первом входе
                terms_accepted:
                  type: boolean
                  description: Обязательно `true` при создании нового аккаунта
      responses:
        '200':
          description: Вход в существующий аккаунт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '201':
          description: Новый аккаунт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/password/forgot:
    post:
      tags:
      - Auth
      summary: Восстановление пароля. Шаг 1. Отправить код
      operationId: forgotPassword
      description: Всегда отвечает 200, даже если такой почты нет (чтобы не раскрывать список аккаунтов).
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Если аккаунт существует, код отправлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSentResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/verify-code:
    post:
      tags:
      - Auth
      summary: Восстановление пароля. Проверить код
      operationId: verifyResetCode
      description: 'Проверяет код до ввода нового пароля, чтобы ошибка показывалась на своём шаге. Код при успехе остаётся действительным и повторно
        передаётся в `/auth/password/reset`. Неверный код: 400 `INVALID_CODE` и одна из трёх попыток потрачена; после трёх неудач код сгорает.'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
      responses:
        '204':
          description: Код верный
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/reset:
    post:
      tags:
      - Auth
      summary: Восстановление пароля. Шаг 2. Новый пароль
      operationId: resetPassword
      description: После успешной смены пароля пользователь сразу входит (возвращаются токены). Обновляет `password_changed_at`.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              - new_password
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Пароль изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Обновление токена
      operationId: refreshToken
      description: 'Refresh-токен одноразовый: при обновлении старый отзывается в Redis, выдаётся новая пара токенов. Отозванный или просроченный
        токен: 401.'
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Новые токены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags:
      - Account
      summary: Данные аккаунта
      operationId: getMyAccount
      description: 'Настройки аккаунта: почта, способ входа, давность смены пароля.'
      responses:
        '200':
          description: Аккаунт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me/email/change-request:
    post:
      tags:
      - Account
      summary: Смена почты. Шаг 1. Отправить код на новую почту
      operationId: requestEmailChange
      description: Если у аккаунта есть пароль, он обязателен. 409, если новая почта уже занята.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_email
              properties:
                new_email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Код отправлен на новую почту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/email/confirm:
    post:
      tags:
      - Account
      summary: Смена почты. Шаг 2. Подтвердить кодом
      operationId: confirmEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_email
              - code
              properties:
                new_email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
      responses:
        '200':
          description: Почта изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/password:
    post:
      tags:
      - Account
      summary: Сменить пароль
      operationId: changePassword
      description: '`current_password` обязателен, если у аккаунта уже есть пароль (аккаунт Яндекса без пароля может задать его впервые). Обновляет
        `password_changed_at`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profiles/me:
    get:
      tags:
      - Profiles
      summary: Получить свой профиль
      operationId: getMyProfile
      responses:
        '200':
          description: Мой профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Profiles
      summary: Частичное обновление профиля (анкета, настройки, уведомления)
      operationId: updateMyProfile
      description: |-
        Обновляются только переданные поля, поэтому анкету можно сохранять по шагам («Сохранить и выйти»). Последним шагом клиент отправляет `onboarding_completed: true`: сервер проверяет, что обязательные для роли поля заполнены, иначе возвращает 400 с перечнем незаполненных полей в `details`.

        **Обязательные поля при завершении анкеты.** Ученик: `age`, `current_status`, `main_goals`, `target_skills`, `time_limit`, `availability_slots`, `communication_style`. Наставник: `job_title`, `experience`, `bio`, `current_skills` (уровни 2–3), `help_topics`, `target_student_levels`, `hourly_rate`, `time_limit`, `max_students`, `availability_slots`, `communication_style`.

        Навыки (`current_skills`, `target_skills`) должны быть из словаря (`GET /skills`). Уровни навыков: ученик 1–3, наставник только 2–3.

        Наставник попадает в очередь верификации (`verification_status = pending`) в момент первой публикации (`is_published: true`), если загружен хотя бы один документ или ссылка. Пока статус не `verified`, наставник не виден в каталоге. Программы (пакеты услуг) редактируются отдельно: `/profiles/me/packages`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profiles/me/avatar:
    post:
      tags:
      - Profiles
      summary: Загрузить фото профиля
      operationId: uploadAvatar
      description: JPG или PNG до 5 МБ.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Фото обновлено
          content:
            application/json:
              schema:
                type: object
                required:
                - avatar_url
                properties:
                  avatar_url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profiles/me/verification-assets:
    post:
      tags:
      - Profiles
      summary: Добавить документы и ссылки для верификации (наставник)
      operationId: addVerificationAssets
      description: Только для роли `mentor`. Можно передать файлы (`files`), ссылки (`links`) или и то и другое, всего не более 10 материалов
        в профиле. Если статус был `verified` или `rejected`, добавление материала переводит его в `pending` (повторная проверка), а наставник
        скрывается из каталога до решения куратора. Если статус `none`, он станет `pending` при первой публикации профиля.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                links:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: uri
      responses:
        '200':
          description: Материалы добавлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /profiles/me/verification-assets/{assetId}:
    delete:
      tags:
      - Profiles
      summary: Удалить материал верификации
      operationId: deleteVerificationAsset
      parameters:
      - name: assetId
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
      responses:
        '200':
          description: Материал удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /profiles/me/packages:
    get:
      tags:
      - Profiles
      summary: Мои программы
      operationId: getMyPackages
      description: Только для роли `mentor`. В каждой программе `pairs_count` — число пар по ней.
      responses:
        '200':
          description: Программы наставника (кроме `archived`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePackage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Profiles
      summary: Создать программу
      operationId: createPackage
      description: 'Создаётся в статусе `draft` (ученикам не видна). Чтобы опубликовать (`status: published`), нужны `title`, `price` (0 = бесплатно)
        и `session_count`, иначе 400 с перечнем полей в `details`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageRequest'
      responses:
        '201':
          description: Программа создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePackage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /packages/{id}:
    patch:
      tags:
      - Profiles
      summary: Изменить программу, опубликовать или снять с публикации
      operationId: updatePackage
      description: 'Частичное обновление. `status: published` публикует программу, `status: draft` снимает с публикации. Уже созданные заявки
        и пары не затрагиваются.'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePackageRequest'
      responses:
        '200':
          description: Программа обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePackage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Profiles
      summary: Удалить программу
      operationId: deletePackage
      description: 'Мягкое удаление: `status = archived`, так как на программу ссылаются заявки. Текущие пары не затрагиваются.'
      parameters:
      - name: id
