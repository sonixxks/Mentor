  /curator/workspaces:
    get:
      tags:
      - Curator
      summary: Дашборд куратора (Светофор)
      operationId: getCuratorWorkspaces
      description: 'Сигналы проблем вычисляются на лету: `no_activity` (нет активности 7 дней и больше), `overdue_tasks` (просрочено 2 задачи
        и больше), `bad_reviews` (последняя оценка встречи 2 и ниже). `severity`: `red` при стагнации или двух сигналах, `yellow` при одном, иначе
        `green`. В ответе `counts` для плиток (только незавершённые пары). Статус `stagnation` куратор ставит вручную.'
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Поиск по имени ученика или наставника
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - severity
          - activity
          default: severity
        description: '`severity` — сначала проблемные'
      - name: has_signals
        in: query
        schema:
          type: boolean
      - *id004
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 50
      responses:
        '200':
          description: Список пар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratorWorkspacePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
