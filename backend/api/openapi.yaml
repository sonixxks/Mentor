          - hidden
          - awaiting_match
          - invited
      - name: q
        in: query
        schema:
          type: string
        description: Поиск по имени или почте
      responses:
        '200':
          description: Страница пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/curators:
    post:
      tags:
      - Admin
      summary: Создать куратора (отправить приглашение)
      operationId: createCurator
      description: 'Только роль `admin`. Создаёт аккаунт куратора без пароля и отправляет письмо со ссылкой на 48 часов (`POST /auth/invitation/accept`).
        Если куратор с такой почтой уже создан, но пароль не задал, приглашение отправляется повторно (200). Если почта занята другим аккаунтом:
        409.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - first_name
              - last_name
              - email
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Приглашение отправлено повторно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserItem'
        '201':
          description: Куратор создан, приглашение отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Не авторизован (токен отсутствует или истёк)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Доступ запрещен (нехватка прав)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт бизнес-логики
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Превышен лимит попыток или частоты отправки кода
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить
          schema:
            type: integer
  schemas:
    ErrorResponse:
      type: object
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
          enum:
          - VALIDATION_ERROR
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - INVALID_CODE
          - TOO_MANY_REQUESTS
          - ROLE_REQUIRED
          - PROFILE_INCOMPLETE
          - MENTOR_LIMIT_REACHED
          - REQUEST_LIMIT_REACHED
          - DUPLICATE_REQUEST
          - REVIEW_EXISTS
          - INVALID_TOKEN
          - INVALID_TRANSITION
        message:
          type: string
        details:
          type: array
          items:
            type: string
    MentorPageResponse:
      type: object
      required:
      - total
      - page
      - items
      properties:
        total:
          type: integer
        page:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/MentorSummary'
    RequestPageResponse:
      type: object
      required:
      - total
      - page
      - items
      properties:
        total:
          type: integer
        page:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestResponse'
    CuratorRequestPageResponse:
      type: object
      required:
      - total
      - page
      - items
      properties:
        total:
          type: integer
        page:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CuratorRequestResponse'
    WorkspacePageResponse:
      type: object
      required:
      - total
      - page
      - items
      properties:
        total:
          type: integer
        page:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    ProfilePageResponse:
      type: object
      required:
      - total
      - page
      - items
      properties:
        total:
          type: integer
        page:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CuratorProfileResponse'
    ReviewPageResponse:
      type: object
      required:
      - total
      - page
      - items
      properties:
        total:
          type: integer
        page:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewResponse'
    CuratorWorkspacePageResponse:
      type: object
      required:
      - total
      - page
      - items
      - counts
      properties:
        total:
          type: integer
        page:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CuratorWorkspaceSummary'
        counts:
          type: object
          required:
          - total
          - active
          - paused
          - stagnation
          properties:
            total:
              type: integer
            active:
              type: integer
            paused:
              type: integer
            stagnation:
              type: integer
    NotificationPageResponse:
      type: object
      required:
      - total
      - page
      - items
      - unread_count
      properties:
        total:
          type: integer
        page:
          type: integer
        unread_count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
    UnreadCounts:
      type: object
      required:
      - total
      - requests
      - tasks
      - messages
      properties:
        total:
          type: integer
        requests:
          type: integer
        tasks:
          type: integer
        messages:
          type: integer
    CodeSentResponse:
      type: object
      required:
      - expires_in_seconds
      - resend_after_seconds
      properties:
        expires_in_seconds:
          type: integer
          example: 600
        resend_after_seconds:
          type: integer
          example: 60
    RegisterRequest:
      type: object
      required:
      - role
      - email
      - password
      - first_name
      - last_name
      - terms_accepted
      properties:
        role:
          type: string
          enum:
          - student
          - mentor
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        terms_accepted:
          type: boolean
          enum:
          - true
          description: Согласие с условиями и обработкой персональных данных. Момент согласия сохраняется в `Users.consent_at`.
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        remember_me:
          type: boolean
          default: false
          description: При `true` выдаётся долгоживущий refresh-токен
    TokenResponse:
      type: object
      required:
      - access_token
      - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    UserMeResponse:
      type: object
      required:
      - id
      - email
      - role
      - has_password
      properties:
        id: *id002
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - student
          - mentor
          - curator
          - admin
        has_password:
          type: boolean
          description: false для аккаунтов, созданных через Яндекс ID
        password_changed_at:
          type: string
          format: date-time
          nullable: true
          description: null, если пароль ни разу не менялся
    SkillObject:
      type: object
      required:
      - skill
      - level
      properties:
        skill:
          type: string
          description: Название из словаря (`GET /skills`)
        level:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: 1 — Новичок, 2 — Уверенно, 3 — Профи/Эксперт. Для наставника допустимы только 2 и 3.
    AvailabilitySlots:
      type: object
      additionalProperties: false
      description: 'Удобные часы по дням недели в екатеринбургском времени. Каждое число — начало часового слота (8..21). Пример: `{"mon": [19,
        20, 21], "sat": [10, 11, 12, 13]}`.'
      properties:
        mon:
          $ref: '#/components/schemas/HourList'
        tue:
          $ref: '#/components/schemas/HourList'
        wed:
          $ref: '#/components/schemas/HourList'
        thu:
          $ref: '#/components/schemas/HourList'
        fri:
          $ref: '#/components/schemas/HourList'
        sat:
          $ref: '#/components/schemas/HourList'
        sun:
          $ref: '#/components/schemas/HourList'
    HourList:
      type: array
      uniqueItems: true
      items:
        type: integer
        minimum: 8
        maximum: 21
    UpdatePackageRequest:
      type: object
