        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Curator
      summary: Предложить наставника ученику (ручной подбор)
      operationId: createCuratorRequest
      description: 'Создаёт обычную заявку `pending` от ученика к выбранному наставнику (в лимит 3 активных заявок не входит). Наставник и ученик
        получают уведомление: наставник одобряет, ученик подтверждает. У ученика должен быть `needs_curator_help = true`; у наставника есть свободное
        место.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - student_id
              - mentor_id
              properties:
                student_id: *id002
                mentor_id: *id002
                service_package_id: *id002
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
