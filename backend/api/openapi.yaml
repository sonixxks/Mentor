              properties:
                status:
                  type: string
                  enum:
                  - verified
                  - rejected
                comment:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratorProfileResponse'
