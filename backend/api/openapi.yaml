      - Catalog
      summary: Словарь навыков (поиск и популярные)
      operationId: getSkills
      description: Единый словарь навыков для анкет учеников, анкет наставников, программ и фильтров каталога. Темы помощи (`help_topics`, например
        «Собеседования») в словарь не входят.
      security: *id001
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Поиск по подстроке
      - name: popular
        in: query
        schema:
          type: boolean
        description: Только популярные (для подсказок-чипов)
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: Список названий навыков
          content:
