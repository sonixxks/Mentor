  /meetings/{meetingId}/reviews:
    post:
      tags:
      - Workspaces
      summary: Оценить встречу
      operationId: createMeetingReview
      description: 'Оценку ставит каждый участник пары после начала встречи, одну на встречу (повтор: 409 `REVIEW_EXISTS`). Адресат (`target_id`)
        определяется автоматически. Оценка ученика публичная: попадает в карточку наставника (имя ученика, дата встречи) и в `rating_avg` / `reviews_count`.
        Оценка наставника видна только куратору. Низкая последняя оценка (2 и ниже) от любой стороны дает сигнал `bad_reviews`.'
