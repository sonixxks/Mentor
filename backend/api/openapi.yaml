              schema:
                type: array
                items:
                  type: string
  /mentors:
    get:
      tags:
      - Catalog
      summary: Каталог наставников
      operationId: getMentors
      description: Только наставники с `verification_status = verified` и `is_published = true`. Для авторизованного ученика с заполненной анкетой
        в каждой карточке есть `match`; без авторизации `match` отсутствует, а сортировка `match` недоступна (используется `rating`). Наставники,
        у которых нет свободных мест, остаются в каталоге с `free_slots = 0` (на фронте «мест нет»). Сравнение наставников (до 3) делает клиент
        по данным карточек.
      security: &id003
      - {}
      - BearerAuth: []
      parameters:
      - &id004
        name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          maximum: 50
      - name: q
        in: query
        schema:
          type: string
        description: Поиск по навыку, имени или компании
      - name: skills
        in: query
        schema:
          type: string
        description: Названия навыков из словаря через запятую
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - match
          - rating
          - price_asc
          - price_desc
          - experience
          default: match
      - name: price_min
        in: query
        schema:
          type: number
          minimum: 0
        description: Цена за час, от
      - name: price_max
        in: query
        schema:
          type: number
          minimum: 0
        description: Цена за час, до
      - name: hours_min
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
        description: Часов в неделю у наставника, от
      - name: hours_max
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
        description: Часов в неделю у наставника, до
      - name: min_match
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100
        description: Минимальная совместимость, %
      - name: min_rating
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 5
      - name: has_free_slots
        in: query
